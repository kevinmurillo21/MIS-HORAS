<script>
const VER='1.7',$=s=>document.querySelector(s),K='mishoras.v1';
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let ok=true,T='reg',S;
try{S=JSON.parse(localStorage.getItem(K)||'null');localStorage.setItem(K+'t','1')}catch(e){ok=false}
S=S||{days:{},rates:[{from:'2000-01-01',rate:0}],step:30,mode:'seg'};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fix=()=>{S.notes=S.notes||{};S.seen=S.seen||{};S.goalHit=S.goalHit||{};if(S.lunch===undefined)S.lunch=60;if(S.onbDone===undefined)S.onbDone=!!(Object.keys(S.days||{}).length||S.name||(S.rates||[]).some(r=>r.rate>0));S.drafts=S.drafts||{};S.ds=+S.ds||0;S.dp=+S.dp||0;S.goal=+S.goal||0;S.since=S.since||Date.now()};fix();
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false}};
const p2=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const today=()=>iso(new Date()),dt=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8));
const fdate=k=>dt(k).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const wd=k=>dt(k).toLocaleDateString('es-CO',{weekday:'short'});
let REV=false;const $r=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n));
const $$=n=>S.hide&&!REV?'••••':$r(n);
const fm=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`};
const tm=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const rateFor=d=>([...S.rates].sort((a,b)=>a.from<b.from?1:-1).find(r=>r.from<=d)||{rate:0}).rate;
function calc(segs){const st=S.step;let raw=0,c=0;const per=[];
 for(const g of segs){if(!g.i||!g.o||g.i===g.o){per.push(null);continue}
  let d=tm(g.o)-tm(g.i);if(d<=0)d+=1440;
  const k=S.mode==='seg'&&st>1?Math.floor(d/st)*st:d;per.push({d,k});raw+=d;c+=k}
 if(S.mode==='day'&&st>1)c=Math.floor(raw/st)*st;
 return{raw,c,lost:raw-c,per}}
let D,M={y:new Date().getFullYear(),m:new Date().getMonth()};
const blank=()=>[{i:'',o:''},{i:'',o:''}];
function openDay(d){const f=S.drafts[d];D=f?{date:d,note:f.note||'',segs:f.segs.map(x=>({...x}))}:{date:d,note:S.notes[d]||'',segs:(S.days[d]||blank()).map(x=>({...x}))}}
{const ks=Object.keys(S.drafts).sort();openDay(S.drafts[today()]?today():ks.length?ks[ks.length-1]:today())}
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',1800)}

function vReg(){const n=new Date(),q=n.getDate()<=15?1:2,t=qr(n.getFullYear(),n.getMonth(),q);
return `${bk()}${dr()}${gd()}${mk()}${onb()}<section class="card qc"><small>Quincena actual · ${qL(n.getFullYear(),n.getMonth(),q)} de ${MES[n.getMonth()].toLowerCase()}</small><big class="cu">${$$(t.pay)}</big>${netL(t.pay)}<small>${fm(t.c)} contadas · ${t.n} ${t.n===1?'día':'días'}</small>${goal(t.c)}${projL()}</section>

 if(p==='and')return `${DP?'<button class="pri" style="width:100%;margin-bottom:10px" data-a="gi">Instalar ahora</button>':''}<ol class="gs"><li>Toca los <b>tres puntos ⋮</b> de Chrome</li><li>Elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b></li><li>Confirma y ábrela desde su ícono</li></ol>`;
 return `<ol class="gs"><li>Abre este link en tu celular: <b>${esc(appUrl())}</b></li><li>En el celular, sigue los pasos que te muestra la app para añadirla a la pantalla de inicio</li></ol><div class="row" style="margin:0"><button class="ghost" style="margin:0" data-a="cpl">Copiar link</button></div>`}
function gd(){if(S.guideOff||inApp()||plat()==='pc')return '';return `<section class="card gd"><div class="obh"><b>📲 Instala la app en tu celular</b><button class="lnk" data-a="gx">Ahora no</button></div><small>Se abre como una app y funciona sin internet.</small>${steps()}</section>`}
function dr(){const o=Object.keys(S.drafts).filter(k=>k!==D.date).sort();return o.length?`<div class="warn">✏️ Registro sin guardar: ${o.map(k=>`<button class="lnk" data-a="od" data-d="${k}">${k.slice(8)}/${k.slice(5,7)}</button>`).join(' · ')}</div>`:''}
function cal(){const y=M.y,m=M.m,N=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+(S.sun?0:6))%7,td=today();let h='';
 for(let i=0;i<off;i++)h+='<i></i>';
 for(let d=1;d<=N;d++){const k=`${y}-${p2(m+1)}-${p2(d)}`,w=S.days[k],c=w?calc(w).c/60:0,dm=Q&&qOf(k)!==Q;
  h+=`<button style="--i:${d}" class="cd${w?' w':''}${k===td?' hoy':''}${dm?' dm':''}" data-a="od" data-d="${k}"><b>${d}</b><small>${w?(+c.toFixed(1))+'h'+(S.notes[k]?'•':''):''}</small></button>`}
 return `<section class="card"><div class="cal">${(S.sun?'DLMMJVS':'LMMJVSD').split('').map(x=>`<em>${x}</em>`).join('')}${h}</div></section>`}
function shareTxt(){const y=M.y,m=M.m,ks=monthKeys(Q),t=qr(y,m,Q),mes=MES[m].toLowerCase();
 let x=`Mis Horas · ${Q?`${Q}ª quincena (${qL(y,m,Q)} de ${mes} ${y})`:`${MES[m]} ${y}`}\n`;
 x+=ks.map(k=>`${k.slice(8)}/${p2(m+1)}: ${fm(calc(S.days[k]).c)}${S.notes[k]?' ('+S.notes[k]+')':''}`).join('\n');
 x+=`\n\nDías: ${t.n}\nHoras contadas: ${fm(t.c)}\nPago aprox.: ${$r(t.pay)}`;
 if(dsc())x+=`\nNeto aprox.: ${$r(t.pay*(1-dsc()/100))}`;
 if(navigator.share)navigator.share({text:x}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast('Resumen copiado ✓'));else toast('No se pudo compartir')}
function chart(){const N=new Date(M.y,M.m+1,0).getDate(),a=Q===2?16:1,z=Q===1?15:N,n=z-a+1,W=330,st=W/n,H=110,hs=[];
 for(let d=a;d<=z;d++){const k=`${M.y}-${p2(M.m+1)}-${p2(d)}`;hs.push(S.days[k]?calc(S.days[k]).c/60:0)}
 const mx=Math.max(8,Math.ceil(Math.max(...hs)));
 const bars=hs.map((h,i)=>{const bh=h/mx*H,x=i*st+st*.18,w=st*.64,d=a+i,cx=x+w/2;
  return `<rect class="bar" style="animation-delay:${i*22}ms" x="${x}" y="${H-bh}" width="${w}" height="${h?Math.max(bh,2):0}" rx="${Math.min(4,w/2)}"/>${n<=16&&h?`<text class="lbl" x="${cx}" y="${H-bh-4}" text-anchor="middle">${+h.toFixed(1)}</text>`:''}${n<=16||d%5===0||d===a?`<text class="lbl" x="${cx}" y="${H+14}" text-anchor="middle">${d}</text>`:''}`}).join('');
 return `<section class="card"><h3>Horas por día</h3><svg viewBox="0 -14 ${W} ${H+34}" width="100%" role="img" aria-label="Horas por día"><line class="axis" x1="0" x2="${W}" y1="${H}" y2="${H}"/>${bars}</svg><small>Escala hasta ${mx} h</small></section>`}
function vYear(){const y=M.y,mm=Array.from({length:12},()=>({c:0,p:0,n:0}));
 Object.keys(S.days).filter(k=>k.startsWith(y+'-')).forEach(k=>{const r=calc(S.days[k]),i=+k.slice(5,7)-1;mm[i].c+=r.c;mm[i].p+=r.c/60*rateFor(k);mm[i].n++});
 const T=mm.reduce((a,x)=>({c:a.c+x.c,p:a.p+x.p,n:a.n+x.n}),{c:0,p:0,n:0});if(!T.n)return '';
 return `<section class="card"><small>Acumulado ${y}</small><big class="cu" style="font-size:28px">${$$(T.p)}</big>${netL(T.p)}<small>${fm(T.c)} · ${T.n} ${T.n===1?'día':'días'}</small>${mm.map((x,i)=>x.n?`<div class="rt"><span>${MES[i]}</span><span>${fm(x.c)} · <b style="font-size:15px">${$$(x.p)}</b></span></div>`:'').join('')}</section>`}
function vMes(){const ks=monthKeys(Q),t=qr(M.y,M.m,Q),a=qr(M.y,M.m,1),b=qr(M.y,M.m,2);
 const rows=ks.map(k=>{const r=calc(S.days[k]),g=r.c/60*rateFor(k);
  return `<button class="day" data-a="od" data-d="${k}"><div class="dd"><b>${k.slice(8)}</b><small>${wd(k)}</small></div><div>${fm(r.c)}<small>${S.days[k].map(x=>ft(x.i)+'–'+ft(x.o)).join(' · ')}</small>${S.notes[k]?`<small>📝 ${esc(S.notes[k])}</small>`:''}</div><div class="dp">${$$(g)}</div></button>`}).join('');
 return `<div class="mn"><button data-a="pm" aria-label="Mes anterior">‹</button><h2>${MES[M.m]} ${M.y}</h2><button data-a="nm" aria-label="Mes siguiente">›</button></div>
<div class="tabs">${[[0,'Mes'],[1,'1ª quincena'],[2,'2ª quincena']].map(([v,l])=>`<button data-a="q" data-n="${v}" class="${Q===v?'on':''}">${l}</button>`).join('')}</div>
<section class="grid"><div class="card wide"><small>${Q?`Pago de la quincena ${qL(M.y,M.m,Q)}`:'Pago aproximado del mes'}</small><big class="cu">${$$(t.pay)}</big>${netL(t.pay)}${Q?'':`<small>1ª (${qL(M.y,M.m,1)}): ${$$(a.pay)} · 2ª (${qL(M.y,M.m,2)}): ${$$(b.pay)}</small>`}</div>
<div class="card"><small>Horas</small><big>${fm(t.c)}</big></div><div class="card"><small>Días</small><big>${t.n}</big></div><div class="card"><small>No contadas</small><big class="lost">${fm(t.l)}</big></div></section>
${cal()}${Q?goalCard(t.c):''}${cmp(t)}${projCard()}
${ks.length?chart()+wkc():''}${rows||'<p class="empty">Aún no hay registros en este mes</p>'}${vYear()}${ks.length?'<button class="ghost" data-a="sh">📤 Compartir resumen</button><button class="ghost" data-a="csv">Exportar este mes (CSV)</button>':''}`}

let OPEN='';
const acc=(id,ic,t,sub,body,cls='ab')=>`<section class="card nv"><button class="nvh" data-a="ac" data-id="${id}" aria-expanded="${OPEN===id}"><span class="nvi">${ic}</span><span class="nvt"><b>${t}</b><small>${sub}</small></span><span class="nvc">${OPEN===id?'Cerrar':'Abrir'}</span></button><div class="nvm${OPEN===id?' open':''}" data-id="${id}"><div><div class="${cls}">${body}</div></div></div></section>`;
function vCfg(){const rs=[...S.rates].sort((a,b)=>a.from<b.from?1:-1),t=S.th||PRE[0],ti=PRE.findIndex(p=>p.a1===t.a1&&p.a2===t.a2),cr=rateFor(today());
 const pago=`<h4>Valor por hora</h4>${rs.map(r=>`<div class="rt"><div><b>${$r(r.rate)}</b><small>${r.from==='2000-01-01'?'Tarifa inicial':'Desde '+fdate(r.from)}</small></div>${rs.length>1?`<button class="x" data-a="dr" data-d="${r.from}" aria-label="Borrar tarifa">✕</button>`:''}</div>`).join('')}
<div class="tr" style="margin-top:12px"><div><label>Nuevo valor por hora</label><input id="rv" type="number" inputmode="numeric" placeholder="9000"></div><div><label>Rige desde</label><input id="rf" type="date" value="${today()}"></div></div>
<button class="ghost" data-a="ar">＋ Agregar valor</button>
<div class="hint n">Cada día se paga con el valor vigente en su fecha, así los meses anteriores no cambian.</div>
<h4>Descuentos y meta</h4><div class="tr"><div><label>Salud %</label><input id="ds" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="${S.ds}"></div><div><label>Pensión %</label><input id="dp" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="${S.dp}"></div></div>
<label style="margin-top:12px">Meta de horas por quincena</label><input id="gl" type="number" inputmode="numeric" min="0" value="${S.goal||''}" placeholder="Ej.: 80">
<div class="hint n">Con los descuentos en 0 solo ves el pago bruto. Confirma los porcentajes en tu desprendible de pago.</div>`;
 const regla=`<label>Solo cuentan bloques de</label><select id="st">${[[30,'30 minutos'],[15,'15 minutos'],[60,'1 hora'],[1,'Tiempo exacto']].map(([v,tt])=>`<option value="${v}" ${S.step==v?'selected':''}>${tt}</option>`).join('')}</select>
<label style="margin-top:12px">Se aplica a</label><select id="md"><option value="seg" ${S.mode==='seg'?'selected':''}>Cada turno (entrada a huella de cierre)</option><option value="day" ${S.mode==='day'?'selected':''}>El total del día</option></select>
<div class="hint n">Siempre se redondea hacia abajo: 1 h 45 min cuenta como 1 h 30 min.</div>
<label style="margin-top:12px">Duración del almuerzo (minutos)</label><input id="lm" type="number" inputmode="numeric" min="0" max="180" value="${S.lunch}"><div class="hint n">Se usa en la cuenta regresiva del botón de marcar. Pon 0 para quitarla.</div>`;
 const avisos=(()=>{const ok=canNote(),pm=ok?Notification.permission:'none',on=S.notif&&pm==='granted';
 let b;if(!ok)b='<div class="hint n">Este navegador no permite avisos. En iPhone funcionan solo con la app instalada (iOS 16.4 o más).</div>';
 else if(pm==='denied')b='<div class="hint n">Bloqueaste los avisos. Actívalos en los Ajustes del celular → Notificaciones → Mis Horas.</div>';
 else if(on)b='<div class="row" style="margin:0"><button class="pri" data-a="ntt">Probar aviso</button><button class="ghost" style="margin:0;width:auto" data-a="nt0">Desactivar</button></div>';
 else b='<button class="pri" style="width:100%" data-a="nt1">Activar avisos</button>';
 return b+'<div class="hint n" style="margin-top:12px">Al marcar tu salida a almuerzo te llega un aviso con la hora de regreso. Al terminar el almuerzo suena otro aviso mientras la app siga abierta o en segundo plano. Si la cierras del todo, ese último aviso puede no llegar.</div>'})();
 const look=`<label>Tema de color</label><div class="sw">${PRE.map((p,i)=>`<button class="sb${ti===i?' on':''}" data-a="th" data-n="${i}" style="background:linear-gradient(135deg,${p.a1},${p.a2})">${p.n}</button>`).join('')}</div>
<div class="tr" style="margin-top:12px"><div><label>Color 1</label><input type="color" id="c1" value="${t.a1}"></div><div><label>Color 2</label><input type="color" id="c2" value="${t.a2}"></div></div>
<label style="margin-top:12px">Modo</label><select id="lk">${[['auto','Automático (como tu celular)'],['light','Claro'],['dark','Oscuro']].map(([v,l])=>`<option value="${v}" ${(S.look||'auto')===v?'selected':''}>${l}</option>`).join('')}</select>`;
 const pers=`<label>Tu nombre (opcional)</label><input id="nm" maxlength="20" placeholder="Ej.: Laura" value="${esc(S.name||'')}">
<div class="tr" style="margin-top:12px"><div><label>Hora</label><select id="fh">${op([['24','24 horas'],['12','12 horas']],S.h12?'12':'24')}</select></div><div><label>Semana empieza</label><select id="fw">${op([['mon','Lunes'],['sun','Domingo']],S.sun?'sun':'mon')}</select></div></div>
<div class="tr" style="margin-top:12px"><div><label>Tamaño</label><select id="fs">${op([['n','Normal'],['g','Grande'],['x','Muy grande']],S.fs||'n')}</select></div><div><label>Montos</label><select id="hd">${op([['show','Mostrar'],['hide','Ocultar']],S.hide?'hide':'show')}</select></div></div>
<div class="hint n">Si ocultas los montos, aparece un ojito arriba para verlos un momento.</div>`;
 const inv=`<div class="hint n" style="margin:0 0 10px">Manda el link con las instrucciones para instalarla. Cada quien guarda sus horas solo en su celular.</div><div class="row" style="margin:0"><button class="pri" data-a="inv">Compartir invitación</button><button class="ghost" style="margin:0;width:auto" data-a="cpl">Copiar link</button></div>`;
 const resp=`<div class="row" style="margin:0"><button class="ghost" style="margin:0" data-a="ex">Exportar</button><button class="ghost" style="margin:0" data-a="im">Importar</button></div><input type="file" id="fi" accept=".json,application/json" hidden><div class="hint n">Tus datos viven solo en este teléfono. Exporta un respaldo de vez en cuando.</div>`;
 const tl=`<div class="tl">${NOV.map((n,i)=>`<div class="ti"><span class="tdot${i?'':' now'}"></span><div class="tb"><div class="tv"><b>v${n.v}</b>${i?'':'<em>Actual</em>'}<span>${n.t}</span></div><ul>${n.i.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('')}</div>`;
 return acc('pago','💵','Pago y descuentos',cr?`${$r(cr)} por hora${dsc()?` · descuentos ${dsc()}%`:''}`:'Pon tu valor por hora',pago)
 +acc('regla','⏱','Regla de la empresa',`Bloques de ${S.step===1?'tiempo exacto':S.step===60?'1 hora':S.step+' min'} · ${S.mode==='seg'?'por turno':'por día'}`,regla)
 +acc('avisos','🔔','Avisos del almuerzo',S.notif&&canNote()&&Notification.permission==='granted'?'Activados ✓':'Desactivados',avisos)
 +acc('look','🎨','Apariencia',`${t.n||'Personalizado'} · ${({auto:'Automático',light:'Claro',dark:'Oscuro'})[S.look||'auto']}`,look)
 +acc('pers','👤','Personalizar',S.name?esc(S.name):'Nombre, hora, tamaño y montos',pers)
 +acc('inst','📲','Instalar la app',inApp()?'Ya está instalada ✓':'Cómo añadirla a tu pantalla de inicio',inApp()?'<div class="hint n">Ya la estás usando como app. Si un amigo quiere instalarla, usa Invitar amigos.</div>':steps())
 +acc('inv','🎁','Invitar amigos','Comparte la app con un toque',inv)
 +acc('resp','💾','Respaldo',S.lastBackup?'Último: '+new Date(S.lastBackup).toLocaleDateString('es-CO',{day:'numeric',month:'short'}):'Aún sin respaldo',resp)
 +acc('nov','✨','Novedades',`Versión ${NOV[0].v} · ${NOV[0].t}`,tl,'ab0')
 +`<p class="hint n" style="text-align:center">Mis Horas · versión ${VER}</p>`}

function R(){const n=new Date();
 $('#app').innerHTML=`<header class="hero">${S.hide?`<button class="eye" data-a="eye" aria-label="Ver montos">${REV?'🙈':'👁'}</button>`:''}<div class="dow">${S.name?'Hola, '+esc(S.name)+' · ':''}${n.toLocaleDateString('es-CO',{weekday:'long'})}</div><div class="big">${n.getDate()} de ${MES[n.getMonth()].toLowerCase()}</div><div class="yr">${n.getFullYear()} · <span id="clk"></span></div></header>
<div class="topb" id="topb"><b>${n.getDate()} de ${MES[n.getMonth()].toLowerCase()}</b><span id="tbc"></span></div>
<main${ANIM?` class="an ${DIR}"`:''}>${rateFor(today())||!S.onbDone?'':'<div class="warn">Primero pon tu valor por hora. <button class="lnk" data-a="ob" data-s="pago">Configurar</button></div>'}${ok?'':'<div class="warn">⚠ Este navegador no permite guardar aquí. Usa Ajustes → Exportar para no perder tus horas.</div>'}${T==='reg'?vReg():T==='mes'?vMes():vCfg()}</main>
<nav><i class="pill" style="--x:${PT}"></i>${[['reg','⏱','Registrar'],['mes','📅','Mes'],['cfg','⚙️','Ajustes']].map(([t,i,l])=>`<button data-a="t" data-t="${t}" class="${T===t?'on':''}"><i>${i}</i>${l}</button>`).join('')}</nav>`;
 if(T==='reg')paint();clock();if(ANIM)cu();ANIM=false;DIR='';POPM=false;const ti=({reg:0,mes:1,cfg:2})[T],pl=$('.pill'),tb=$('#topb');if(pl&&PT!==ti)requestAnimationFrame(()=>requestAnimationFrame(()=>pl.style.setProperty('--x',ti)));PT=ti;if(tb)tb.classList.toggle('on',scrollY>110)}
function clock(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!!S.h12});const c=$('#tbc');if(c)c.textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:!!S.h12});lunchCheck();mkTick()}
setInterval(clock,1000);

function dl(name,txt,type){try{const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days||!d.rates)throw 0;
 if(confirm('Esto reemplazará lo que tienes ahora. ¿Continuar?')){S=d;fix();S.lastBackup=Date.now();sv();openDay(today());R();toast('Respaldo cargado ✓')}}catch(e){toast('Archivo no válido')}};r.readAsText(f)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,n=+b.dataset.n;if(['t','pm','nm','q','od'].includes(a)){ANIM=true;const ni=({reg:0,mes:1,cfg:2})[b.dataset.t];DIR=a==='t'?(ni>PT?'to-r':ni<PT?'to-l':''):a==='pm'?'to-l':a==='nm'?'to-r':''}
 if(a==='t'){T=b.dataset.t;R();scrollTo(0,0)}
 else if(a==='as'){D.segs.push({i:'',o:''});saveDraft();R()}
 else if(a==='rs'){D.segs.splice(n,1);saveDraft();R()}
 else if(a==='save'){const s=D.segs.filter(g=>g.i&&g.o&&g.i!==g.o),rest=D.segs.filter(g=>(g.i||g.o)&&!(g.i&&g.o&&g.i!==g.o));if(!s.length){shake();return toast('Pon entrada y salida')}
  S.days[D.date]=s;const nt=D.note.trim();if(nt)S.notes[D.date]=nt;else delete S.notes[D.date];if(rest.length)S.drafts[D.date]={note:D.note,segs:[...s,...rest].map(x=>({...x}))};else delete S.drafts[D.date];sv();D.segs=(rest.length?[...s,...rest]:s).map(x=>({...x}));R();checkFx();goalFx();toast(rest.length?'Guardado ✓ · falta la salida del último turno':'Día guardado ✓')}
 else if(a==='del'){if(confirm('¿Borrar este día?')){delete S.days[D.date];delete S.notes[D.date];delete S.drafts[D.date];sv();openDay(D.date);R()}}
 else if(a==='od'){openDay(b.dataset.d);T='reg';R();scrollTo(0,0)}
 else if(a==='now'){const d=new Date();D.segs[n][b.dataset.f]=p2(d.getHours())+':'+p2(d.getMinutes());saveDraft();R()}
 else if(a==='nv'){NV=!NV;const m=$('#nvm');if(m)m.classList.toggle('open',NV);b.setAttribute('aria-expanded',NV);const c=b.querySelector('.nvc');if(c)c.textContent=NV?'Ocultar':'Leer más'}
 else if(a==='mk'){ripple(b,e);setTimeout(doMark,170)}
 else if(a==='nt1')askNote()
 else if(a==='nt0'){S.notif=false;sv();R()}
 else if(a==='ntt')note('🔔 Prueba','Así se verán tus avisos del almuerzo','prueba')
 else if(a==='gx'){S.guideOff=true;sv();R()}
 else if(a==='gi'){if(DP){DP.prompt();DP.userChoice.finally(()=>{DP=null;R()})}}
 else if(a==='mkend'){S.lastOut=null;sv();mkTick()}
 else if(a==='inv'){const x=`¡Hola! Te comparto *Mis Horas* 📲, una app para llevar la cuenta de tus horas de trabajo y calcular tu pago por quincena. Funciona sin internet y tus datos se quedan solo en tu celular.\n\n🍎 iPhone: abre el link en Safari → Compartir → "Añadir a pantalla de inicio".\n🤖 Android: abre el link en Chrome → tres puntos → "Instalar app".\n\n${appUrl()}`;
  if(navigator.share)navigator.share({text:x}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast('Invitación copiada ✓'))}
 else if(a==='cpl'){if(navigator.clipboard)navigator.clipboard.writeText(appUrl()).then(()=>toast('Link copiado ✓'));else toast(appUrl())}
 else if(a==='ac'){const id=b.dataset.id;OPEN=OPEN===id?'':id;if(OPEN==='regla'||OPEN==='look'){S.seen[OPEN]=true;sv()}
  document.querySelectorAll('.nvm[data-id]').forEach(m=>{const o=m.dataset.id===OPEN,h=m.parentElement.querySelector('.nvh');m.classList.toggle('open',o);h.setAttribute('aria-expanded',o);h.querySelector('.nvc').textContent=o?'Cerrar':'Abrir'})}
 else if(a==='ob'){const sec=b.dataset.s;if(!sec){const e=$('#dt');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(sec==='regla'||sec==='look'){S.seen[sec]=true;sv()}T='cfg';OPEN=sec;ANIM=true;R();scrollTo(0,0)}
